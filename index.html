<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shopping Cart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/variables.css" />
  </head> 

  <body>
    <!-- =================================
      Header 
    ================================= -->

    <header class="site-header">
      <div class="header-elements-container">
        <h1>Products</h1>
        <button id="openCartModalBtn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-shopping-cart"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M4 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
            <path d="M15 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
            <path d="M17 17h-11v-14h-2" />
            <path d="M6 5l14 1l-1 7h-13" />
          </svg>
          <span id="cartBadge"></span>
        </button>
      </div>
    </header>

    <!-- Loader apinner -->
    <div class="loader-parent" id="loaderParent">
      <span class="loader"></span>
    </div>

    <!-- =================================
      Show Error
    ================================= -->

    <section class="show-error-section">
      <img src="assets/images/error-img.png" alt="error graphic image" />
      <h3 id="showErrorMessage"></h3>
    </section>

    <!-- =================================
      Products
    ================================= -->

    <main>
      <section class="products-section"></section>
    </main>

    <!-- =================================
      Shopping Cart Modal
    ================================= -->

    <div class="cart-modal" id="cartModal">
      <div class="cart-modal__overlay"></div>
      <section class="cart-modal__dialog">
        <header class="cart-modal__header">
          <h2>Shopping Cart</h2>
          <button class="cart-modal__close-btn" id="closeCartModalBtn"> × </button>
        </header>
        <div class="cart-modal__items" id="cartModalItems"></div>
        <footer class="cart-modal__footer">
          <div class="cart-summary">
            <span>Total</span>
            <strong class="cart-summary__price" id="cartModalPrice">$0</strong>
          </div>
          <button class="cart-modal__checkout" id="checkoutBtn">Place Order</button>
        </footer>
      </section>
    </div>

    <script src="javascript/main.js"></script>
  </body>
</html>
